[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m7-jax"
version = "0.1.0"
description = "Fortran-validated M7 sulfuric-acid coagulation, condensation and nucleation"
requires-python = ">=3.11"
dependencies = ["jax>=0.11.2", "numpy>=2", "scipy>=1.14"]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m7-jax"
version = "0.2.0.dev0"
description = "Fortran-validated ECHAM-HAM M7 aerosol microphysics in JAX"
requires-python = ">=3.11"
dependencies = ["jax>=0.10", "numpy>=2", "scipy>=1.14"]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The authentic version-2 kappa lookup (reference/input/lut_kappa.nc, linked
# here) ships in the wheel so a host can load it without this checkout.
m7_jax = ["data/lut_kappa.nc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
